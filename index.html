<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analemmic</title>
<meta name="description" content="Analemmic: small tools for time, sky, and place.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face { font-family: "JetBrains Mono ExtraLight"; src: url("fonts/jetbrains_mono_extralight.ttf") format("truetype"); font-display: swap; }
  :root { color-scheme: dark; }
  html, body { background: #000; }
  body { margin: 0; color: #e8e6e3; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-inline: 20px; }
  main, footer { max-width: 44rem; margin-inline: auto; }
  main { padding-block: 4rem 2rem; }
  h1, h2 { font-family: "JetBrains Mono ExtraLight", ui-monospace, Menlo, monospace; font-weight: 200; letter-spacing: 0.02em; line-height: 1.2; }
  h1 { font-size: clamp(2.6rem, 8vw, 4.5rem); margin: 0; }
  h2 { font-size: 1.4rem; margin: 2.5rem 0 0.8rem; color: #f0b13a; }
  p { color: #c9c5c0; }
  a { color: #f0b13a; text-underline-offset: 3px; }
  a:hover { color: #ffd27a; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0.6rem 0; }
  li a { font-family: "JetBrains Mono ExtraLight", ui-monospace, Menlo, monospace; font-size: 1.25rem; }
  footer { border-top: 1px solid #222; padding-block: 1.5rem 3rem; color: #9a958f; font-size: 0.9rem; }
  footer a { color: #9a958f; }
</style>
</head>
<body>
<main>
  <h1>Analemmic</h1>
  <p>Small tools for time, sky, and place.</p>
  <h2>Projects</h2>
  <ul>
    <li><a href="nightwatch/">Nightwatch</a> <span>· a 24-hour sun, moon, and tide watch face for Wear OS</span></li>
  </ul>
</main>
<footer>© 2026 Analemmic · <a href="https://github.com/analemmic">GitHub</a></footer>
</body>
</html>
